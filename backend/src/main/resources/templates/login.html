<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7fb; padding: 40px; }
        .box { max-width: 420px; margin: 80px auto; background: white; padding: 24px; border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 10px; margin: 8px 0 12px; border-radius: 6px; border: 1px solid #ccc; }
        button { width: 100%; padding: 10px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; }
        .error { color: red; margin-bottom: 12px; }
    </style>
</head>
<body>
<div class="box">
    <h2>Sign in</h2>
    <div th:if="${param.error}" class="error">Invalid username or password.</div>
    <div th:if="${param.logout}" style="color: green;">You have been logged out.</div>
    <form th:action="@{/login}" method="post">
        <label>Username</label>
        <input id="username" type="text" name="username" required>
        <label>Password</label>
        <input id="password" type="password" name="password" required>
        <button type="submit">Login</button>
    </form>
    <p id="message"></p>
    <p>Demo users: student/student123, supervisor/supervisor123, admin/admin123</p>
</div>
<script src="/app.js"></script>
</body>
</html>
