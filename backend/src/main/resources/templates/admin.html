<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7fb; padding: 36px; }
        .container { max-width: 1100px; margin: 0 auto; }
        .card { background: white; border-radius: 18px; box-shadow: 0 16px 40px rgba(15, 23, 42, 0.12); overflow: hidden; margin-bottom: 24px; }
        .card-header { padding: 20px 24px; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; }
        .card-header h2 { margin: 0; font-size: 1.4rem; }
        .card-body { padding: 24px; }
        .alert { padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; }
        .alert-success { background: #dcfce7; color: #166534; }
        .alert-error { background: #fee2e2; color: #991b1b; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { font-weight: 700; color: #334155; background: #f8fafc; }
        tr:hover { background: #f1f5f9; }
        .btn { display: inline-block; padding: 8px 16px; border-radius: 8px; font-size: 0.9rem; cursor: pointer; text-decoration: none; border: none; }
        .btn-primary { background: #2563eb; color: white; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-secondary { background: #e2e8f0; color: #0f172a; }
        .btn-sm { padding: 4px 10px; font-size: 0.8rem; }
        .form-inline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .form-inline input, .form-inline select { padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.9rem; }
        .form-inline input { width: 180px; }
        .form-inline select { width: 140px; }
        .actions { display: flex; gap: 6px; }
        .add-form { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
        .add-form .field { display: flex; flex-direction: column; gap: 4px; }
        .add-form label { font-size: 0.8rem; font-weight: 600; color: #64748b; }
        .add-form input, .add-form select { padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.9rem; }
        .add-form input { width: 200px; }
        .add-form select { width: 160px; }
        a { color: #2563eb; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .back-link { margin-bottom: 16px; }
    </style>
</head>
<body>
<div class="container">
    <div class="back-link">
        <a href="/dashboard">&larr; Back to Dashboard</a>
    </div>
    <div class="card">
        <div class="card-header">
            <h2>Admin Dashboard</h2>
        </div>
        <div class="card-body">
            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

            <h3 style="margin-top: 0;">Add User</h3>
            <form th:action="@{/admin/users}" method="post" class="add-form">
                <div class="field">
                    <label>Username</label>
                    <input type="text" name="username" required/>
                </div>
                <div class="field">
                    <label>Role</label>
                    <select name="role" required>
                        <option th:each="role : ${roles}" th:value="${role}" th:text="${role}"></option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Add User</button>
            </form>

            <h3 style="margin-top: 32px;">Users</h3>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Username</th>
                            <th>Role</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="user : ${users}">
                            <td th:text="${user.id}"></td>
                            <td th:text="${user.username}"></td>
                            <td th:text="${user.role}"></td>
                            <td class="actions">
                                <form th:action="@{/admin/users/update}" method="post" style="display: inline;">
                                    <input type="hidden" name="id" th:value="${user.id}" />
                                    <input type="text" name="username" th:value="${user.username}" style="width: 140px; padding: 4px 8px; border: 1px solid #cbd5e1; border-radius: 6px;" required />
                                    <select name="role" style="padding: 4px 8px; border: 1px solid #cbd5e1; border-radius: 6px;">
                                        <option th:each="role : ${roles}" th:value="${role}" th:text="${role}" th:selected="${user.role == role.name()}"></option>
                                    </select>
                                    <button type="submit" class="btn btn-primary btn-sm">Save</button>
                                </form>
                                <form th:action="@{/admin/users/delete}" method="post" style="display: inline;" onsubmit="return confirm('Are you sure you want to delete this user?');">
                                    <input type="hidden" name="id" th:value="${user.id}" />
                                    <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
