<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit} ? 'Edit Company - Internship Management System' : 'Add New Company - Internship Management System'">Add Company</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/riho.css}">
</head>
<body>

    <!-- Sidebar Navigation -->
    <div class="sidebar">
        <div class="sidebar-brand">
            <div class="brand-logo"><i class="fa-solid fa-graduation-cap"></i></div>
            <div>
                <div class="brand-name">IMS Portal</div>
                <div class="brand-sub">Internship Management</div>
            </div>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-label">Main</div>
            <div class="nav-dropdown">
                <button type="button" class="nav-link nav-dropdown-toggle" aria-expanded="false">
                    <i class="fa-solid fa-gauge"></i> Dashboard <i class="fa-solid fa-chevron-down nav-caret"></i>
                </button>
                <div class="nav-submenu">
                    <a th:href="@{/university/dashboard}"><i class="fa-solid fa-user-tie"></i> University Area</a>
                    <a th:href="@{/student/dashboard}"><i class="fa-solid fa-user-graduate"></i> Student Area</a>
                    <a th:href="@{/company}"><i class="fa-solid fa-building"></i> Company Area</a>
                </div>
            </div>
            <a class="nav-link active" href="/company"><i class="fa-solid fa-building-flag"></i> Companies</a>
            <a class="nav-link" href="/student/dashboard"><i class="fa-solid fa-user-graduate"></i> Students</a>
        </nav>
        <div class="sidebar-footer">
            <a class="nav-link" href="/logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main">
        <!-- Topbar -->
        <header class="topbar">
            <div class="topbar-search">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Search companies..." aria-label="Search" />
            </div>
            <div class="topbar-actions">
                <button type="button" class="icon-btn" title="Notifications">
                    <i class="fa-regular fa-bell"></i>
                    <span class="notif-dot"></span>
                </button>
                <div class="user-chip">
                    <div class="avatar"><i class="fa-solid fa-building"></i></div>
                    <div>
                        <div class="user-name">Company Management</div>
                        <div class="user-role">Companies</div>
                    </div>
                </div>
            </div>
        </header>

        <div class="content">
            <div class="page-header">
                <div>
                    <h1 class="page-title" th:text="${isEdit} ? 'Edit Company' : 'Add New Company'">Add New Company</h1>
                    <p class="page-subtitle" th:text="${isEdit} ? 'Update the details of the partner company and save your changes.' : 'Register a new partner company to the system.'">
                        Register a new partner company to the system.
                    </p>
                </div>
                <div class="page-actions">
                    <a href="/company" class="btn btn-outline"><i class="fa-solid fa-arrow-left"></i> Back to Companies</a>
                </div>
            </div>

            <div class="card" style="max-width: 900px;">
                <div class="card-header">
                    <span class="card-title"><i class="fa-solid fa-building"></i> <span th:text="${isEdit} ? 'Company Details' : 'Company Information'">Company Information</span></span>
                    <span class="card-hint">Fields marked * are required</span>
                </div>
                <div class="card-body">
                    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
                    <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

                    <form th:action="${isEdit} ? @{/company/update} : @{/company/save}" th:object="${company}" method="post">
                        <input type="hidden" th:field="*{id}" />

                        <div class="form-grid">
                            <div class="form-group">
                                <label>Company Name *</label>
                                <input type="text" th:field="*{name}" class="form-input" placeholder="e.g. Airtel Uganda" required>
                            </div>

                            <div class="form-group">
                                <label>Location *</label>
                                <input type="text" th:field="*{location}" class="form-input" placeholder="e.g. Kampala, Uganda" required>
                            </div>

                            <div class="form-group">
                                <label>Email</label>
                                <input type="email" th:field="*{email}" class="form-input" placeholder="contact@example.com">
                            </div>

                            <div class="form-group">
                                <label>Phone</label>
                                <input type="text" th:field="*{phone}" class="form-input" placeholder="e.g. 0700000000">
                            </div>

                            <div class="form-group">
                                <label>Website</label>
                                <input type="text" th:field="*{website}" class="form-input" placeholder="e.g. www.example.com">
                            </div>

                            <div class="form-group">
                                <label>Department *</label>
                                <input type="text" th:field="*{department}" class="form-input" placeholder="e.g. Human Resources" required>
                            </div>

                            <div class="form-group">
                                <label>Field Supervisor *</label>
                                <input type="text" th:field="*{fieldSupervisor}" class="form-input" placeholder="e.g. John Mukasa" required>
                            </div>

                            <div class="form-group">
                                <label>Partnership Roles</label>
                                <input type="text" th:field="*{roles}" class="form-input" placeholder="e.g. Hosting Partner, Sponsor">
                            </div>

                            <div class="form-group full">
                                <label>Company Profile / Industry *</label>
                                <textarea th:field="*{profile}" class="form-input" rows="5" placeholder="Describe the company's industry, services, and internship opportunities..." required></textarea>
                            </div>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">
                                <i class="fa-solid" th:classappend="${isEdit} ? 'fa-save' : 'fa-plus'"></i>
                                <span th:text="${isEdit} ? 'Save Changes' : 'Add Company'">Add Company</span>
                            </button>
                            <a href="/company" class="btn btn-outline"><i class="fa-solid fa-xmark"></i> Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.querySelectorAll('.nav-dropdown').forEach(function (dropdown) {
            var toggle = dropdown.querySelector('.nav-dropdown-toggle');
            if (!toggle) return;
            toggle.addEventListener('click', function () {
                var open = dropdown.classList.toggle('open');
                toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
            });
        });
        document.addEventListener('click', function (event) {
            document.querySelectorAll('.nav-dropdown.open').forEach(function (dropdown) {
                if (!dropdown.contains(event.target)) {
                    dropdown.classList.remove('open');
                    var t = dropdown.querySelector('.nav-dropdown-toggle');
                    if (t) t.setAttribute('aria-expanded', 'false');
                }
            });
        });
    </script>
</body>
</html>
