<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1e293b; padding: 40px; }
        .box { max-width: 420px; margin: 80px auto; background: white; padding: 24px; border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,0.3); }
        input { width: 100%; padding: 10px; margin: 8px 0 12px; border-radius: 6px; border: 1px solid #ccc; }
        button { width: 100%; padding: 10px; background: #dc2626; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; }
        button:hover { background: #b91c1c; }
        .error { color: red; margin-bottom: 12px; }
        .link { text-align: center; margin-top: 12px; }
        .link a { color: #2563eb; text-decoration: none; }
        .back-link { text-align: center; margin-top: 16px; }
        .back-link a { color: #94a3b8; text-decoration: none; font-size: 0.9rem; }
        .shield { text-align: center; margin-bottom: 16px; font-size: 2rem; }
    </style>
</head>
<body>
<div class="box">
    <div class="shield">&#128737;</div>
    <h2>Admin Sign In</h2>
    <div th:if="${param.error}" class="error">Invalid username or password.</div>
    <div th:if="${param.logout}" style="color: green;">You have been logged out.</div>
    <form th:action="@{/admin/login}" method="post">
        <label>Username</label>
        <input id="username" type="text" name="username" required>
        <label>Password</label>
        <input id="password" type="password" name="password" required>
        <button type="submit">Admin Login</button>
    </form>
    <div class="back-link">
        <a href="/login">&larr; Back to regular login</a>
    </div>
    <div class="link">
        <a href="/register">Create a new account</a>
    </div>
</div>
</body>
</html>
