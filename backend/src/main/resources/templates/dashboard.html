<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7fb; padding: 40px; }
        .box { max-width: 720px; margin: 40px auto; background: white; padding: 24px; border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,0.1); }
        a { display: inline-block; margin: 10px 10px 10px 0; padding: 10px 14px; background: #111827; color: white; text-decoration: none; border-radius: 6px; }
        button { padding: 10px 14px; background: #dc2626; color: white; border: none; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>
<div class="box">
    <h2>Welcome, <span th:text="${username}">User</span>!</h2>
    <p>Choose your role area:</p>
    <div>
        <a th:if="${showStudentLink}" th:href="@{/student/dashboard}">Student Area</a>
        <a th:if="${showCompanyLink}" th:href="@{/company}">Company Area</a>
        <a th:if="${showAdminLink}" th:href="@{/admin/dashboard}">Admin Area</a>
    </div>
    <form th:action="@{/logout}" method="post" style="margin-top: 16px;">
        <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <button type="submit">Logout</button>
    </form>
</div>
</body>
</html>
