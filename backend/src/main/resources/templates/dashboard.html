<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7fb; padding: 40px; }
        .box { max-width: 720px; margin: 40px auto; background: white; padding: 24px; border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,0.1); }
        a { display: inline-block; margin: 10px 10px 10px 0; padding: 10px 14px; background: #111827; color: white; text-decoration: none; border-radius: 6px; }
    </style>
</head>
<body>
<div class="box">
    <h2>Welcome, <span th:text="${username}"></span>!</h2>
    <p>Choose your role area:</p>
    <div>
        <a th:if="${showStudentLink}" href="/student/dashboard">Student Area</a>
        <a th:if="${showSupervisorLink}" href="/supervisor/dashboard">Supervisor Area</a>
        <a th:if="${showAdminLink}" href="/admin/dashboard">Admin Area</a>
    </div>
    <form th:action="@{/logout}" method="post" style="margin-top: 16px;">
        <button type="submit">Logout</button>
    </form>
</div>
</body>
</html>
