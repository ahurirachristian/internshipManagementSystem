<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7fb; padding: 40px; }
        .box { max-width: 420px; margin: 80px auto; background: white; padding: 24px; border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,0.1); }
        input, select { width: 100%; padding: 10px; margin: 8px 0 12px; border-radius: 6px; border: 1px solid #ccc; }
        button { width: 100%; padding: 10px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; }
        .error { color: red; margin-bottom: 12px; }
        .success { color: green; margin-bottom: 12px; }
        .link { text-align: center; margin-top: 12px; }
        .link a { color: #2563eb; text-decoration: none; }
    </style>
</head>
<body>
<div class="box">
    <h2>Create Account</h2>
    <div th:if="${errorMessage}" class="error" th:text="${errorMessage}"></div>
    <div th:if="${successMessage}" class="success" th:text="${successMessage}"></div>
    <form th:action="@{/register}" method="post">
        <label>Username</label>
        <input type="text" name="username" required>
        <label>Password</label>
        <input type="password" name="password" required>
        <label>Role</label>
        <select name="role">
            <option th:each="role : ${roles}" th:value="${role}" th:text="${role}"></option>
        </select>
        <button type="submit">Register</button>
    </form>
    <div class="link">
        <a href="/login">Already have an account? Sign in</a>
    </div>
</div>
</body>
</html>
