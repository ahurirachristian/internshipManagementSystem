<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7fb; padding: 40px; }
        .box { max-width: 420px; margin: 40px auto; background: white; padding: 24px; border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,0.1); }
        label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 4px; }
        input, select { width: 100%; padding: 10px; margin: 8px 0 14px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 15px; }
        button:disabled { opacity: 0.7; }
        .error { color: red; margin-bottom: 12px; }
        .success { color: green; margin-bottom: 12px; }
        .links { text-align: center; font-size: 13px; margin-top: 14px; }
        .links a { color: #2563eb; }
    </style>
</head>
<body>
<div class="box">
    <h2>Create account</h2>
    <div id="errorBox" class="error"></div>
    <div id="successBox" class="success"></div>
    <form id="registerForm">
        <label>Username</label>
        <input id="username" type="text" name="username" required>
        <label>Role</label>
        <select id="role" name="role" required>
            <option value="STUDENT">Student</option>
            <option value="SUPERVISOR">Supervisor</option>
            <option value="COMPANY">Company</option>
            <option value="ADMIN">Admin</option>
        </select>
        <label>Password</label>
        <input id="password" type="password" name="password" required>
        <label>Confirm Password</label>
        <input id="confirmPassword" type="password" name="confirmPassword" required>
        <button id="registerBtn" type="submit">Register</button>
    </form>
    <div class="links">
        <a th:href="@{/login}">Already have an account? Sign in</a>
    </div>
</div>
<script>
    document.getElementById('registerForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        var errorBox = document.getElementById('errorBox');
        var successBox = document.getElementById('successBox');
        errorBox.textContent = '';
        successBox.textContent = '';
        var btn = document.getElementById('registerBtn');
        btn.disabled = true;
        btn.textContent = 'Creating...';
        try {
            var response = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: document.getElementById('username').value.trim(),
                    role: document.getElementById('role').value,
                    password: document.getElementById('password').value,
                    confirmPassword: document.getElementById('confirmPassword').value
                })
            });
            var data = await response.json().catch(function () { return {}; });
            if (response.ok) {
                successBox.textContent = data.message || 'Account created successfully.';
                setTimeout(function () { window.location.href = '/login?registered'; }, 1200);
            } else {
                errorBox.textContent = data.error || 'Failed to register.';
            }
        } catch (err) {
            errorBox.textContent = 'Cannot reach the server.';
        } finally {
            btn.disabled = false;
            btn.textContent = 'Register';
        }
    });
</script>
</body>
</html>
