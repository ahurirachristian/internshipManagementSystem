<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7fb; padding: 40px; }
        .box { max-width: 420px; margin: 40px auto; background: white; padding: 24px; border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,0.1); }
        label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 4px; }
        input { width: 100%; padding: 10px; margin: 8px 0 14px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 15px; }
        button:disabled { opacity: 0.7; }
        .error { color: red; margin-bottom: 12px; }
        .success { color: green; margin-bottom: 12px; }
        .links { text-align: center; font-size: 13px; margin-top: 14px; }
        .links a { color: #2563eb; }
    </style>
</head>
<body>
<div class="box">
    <h2>Reset password</h2>
    <p style="font-size: 13px; color: #555;">Enter your username and a new password.</p>
    <div id="errorBox" class="error"></div>
    <div id="successBox" class="success"></div>
    <form id="forgotForm">
        <label>Username</label>
        <input id="username" type="text" name="username" required>
        <label>New Password</label>
        <input id="newPassword" type="password" name="newPassword" required>
        <label>Confirm Password</label>
        <input id="confirmPassword" type="password" name="confirmPassword" required>
        <button id="forgotBtn" type="submit">Update Password</button>
    </form>
    <div class="links">
        <a th:href="@{/login}">Back to sign in</a>
    </div>
</div>
<script>
    document.getElementById('forgotForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        var errorBox = document.getElementById('errorBox');
        var successBox = document.getElementById('successBox');
        errorBox.textContent = '';
        successBox.textContent = '';
        var btn = document.getElementById('forgotBtn');
        btn.disabled = true;
        btn.textContent = 'Updating...';
        try {
            var response = await fetch('/api/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: document.getElementById('username').value.trim(),
                    newPassword: document.getElementById('newPassword').value,
                    confirmPassword: document.getElementById('confirmPassword').value
                })
            });
            var data = await response.json().catch(function () { return {}; });
            if (response.ok) {
                successBox.textContent = data.message || 'Password updated successfully.';
                setTimeout(function () { window.location.href = '/login?reset'; }, 1200);
            } else {
                errorBox.textContent = data.error || 'Failed to update password.';
            }
        } catch (err) {
            errorBox.textContent = 'Cannot reach the server.';
        } finally {
            btn.disabled = false;
            btn.textContent = 'Update Password';
        }
    });
</script>
</body>
</html>
