<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Student Profile</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7fb; padding: 36px; }
        .container { max-width: 940px; margin: 0 auto; }
        .card { background: white; border-radius: 18px; box-shadow: 0 16px 40px rgba(15, 23, 42, 0.12); overflow: hidden; }
        .hero { display: flex; gap: 22px; align-items: center; padding: 32px; border-bottom: 1px solid #e2e8f0; }
        .avatar { width: 120px; height: 120px; border-radius: 18px; object-fit: cover; border: 3px solid #2563eb; }
        .hero h1 { margin: 0; font-size: 2rem; }
        .hero p { margin: 8px 0 0; color: #475569; }
        .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; padding: 32px; }
        .field { display: flex; flex-direction: column; gap: 8px; max-width: 360px; }
        label { font-weight: 700; color: #334155; }
        input, select { border: 1px solid #cbd5e1; border-radius: 12px; padding: 10px 12px; font-size: 0.95rem; width: 100%; max-width: 320px; }
        .full-width { grid-column: span 2; }
        .dropdown { position: relative; }
        .dropdown-list { position: absolute; top: 100%; left: 0; right: 0; background: white; border: 1px solid #cbd5e1; border-radius: 10px; max-height: 220px; overflow-y: auto; z-index: 10; }
        .dropdown-item { padding: 10px 14px; cursor: pointer; }
        .dropdown-item:hover { background: #eef2ff; }
        .actions { padding: 0 32px 32px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
        .button { min-width: 140px; }
        .button { background: #2563eb; color: white; border: none; border-radius: 12px; padding: 14px 20px; font-size: 1rem; cursor: pointer; text-decoration: none; }
        .secondary { background: #e2e8f0; color: #0f172a; }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="hero">
            <img th:src="${student.pictureUrl}" src="/images/student-placeholder.svg" alt="Student photo" class="avatar" />
            <div>
                <h1>Edit Profile</h1>
                <p>Update your internship profile information and save changes.</p>
            </div>
        </div>
        <form th:action="@{/student/profile/edit}" th:object="${student}" method="post">
            <div class="form-grid">
                <div class="field"><label>First Name</label><input type="text" th:field="*{firstName}" required/></div>
                <div class="field"><label>Last Name</label><input type="text" th:field="*{lastName}" required/></div>
                <div class="field"><label>Email</label><input type="email" th:field="*{email}" required/></div>
                <div class="field"><label>Phone Number</label><input type="text" th:field="*{phoneNumber}" required/></div>
                <div class="field"><label>Student Number</label><input type="text" th:field="*{studentNumber}" required/></div>
                <div class="field"><label>Registration Number</label><input type="text" th:field="*{registrationNumber}" required/></div>
                <div class="field"><label>Degree Program</label><input type="text" th:field="*{degreeProgram}" required/></div>
                <div class="field"><label>Year of Study</label><select th:field="*{yearOfStudy}" required>
                    <option th:value="1">1</option>
                    <option th:value="2">2</option>
                    <option th:value="3">3</option>
                    <option th:value="4">4</option>
                    <option th:value="5">5</option>
                </select></div>
                <div class="field"><label>Internship Company</label><input type="text" th:field="*{internshipCompany}" required/></div>
                <div class="field full-width"><label>University</label>
                    <input id="university-search" type="text" placeholder="Start typing a university..." value="" autocomplete="off"/>
                    <input type="hidden" th:field="*{universitySupervisor}" id="universitySupervisor" />
                    <div id="university-results" class="dropdown"></div>
                </div>
                <div class="field"><label>Industrial Supervisor ID</label><input type="text" th:field="*{industrialSupervisorId}" required/></div>
                <div class="field"><label>Company ID</label><input type="text" th:field="*{companyId}" required/></div>
                <div class="field full-width"><label>Picture URL</label><input type="text" th:field="*{pictureUrl}" placeholder="/images/student-placeholder.svg"/></div>
            </div>
            <div class="actions">
                <button type="submit" class="button">Save Profile</button>
                <a href="/student/dashboard" class="button secondary">Next Page</a>
            </div>
        </form>
    </div>
</div>
<script>
    const searchInput = document.getElementById('university-search');
    const resultsContainer = document.getElementById('university-results');
    const hiddenField = document.getElementById('universitySupervisor');

    let timeout = null;

    function closeResults() {
        resultsContainer.innerHTML = '';
    }

    function renderResults(items) {
        if (!items.length) {
            resultsContainer.innerHTML = '<div class="dropdown-list"><div class="dropdown-item">No universities found</div></div>';
            return;
        }
        const list = items.map(item =>
            `<div class="dropdown-item" data-name="${item.name}">${item.name}</div>`
        ).join('');
        resultsContainer.innerHTML = `<div class="dropdown-list">${list}</div>`;
        resultsContainer.querySelectorAll('.dropdown-item').forEach(el => {
            el.addEventListener('click', () => {
                const name = el.dataset.name;
                searchInput.value = name;
                hiddenField.value = name;
                closeResults();
            });
        });
    }

    searchInput.addEventListener('input', () => {
        const query = searchInput.value.trim();
        hiddenField.value = query;
        if (timeout) clearTimeout(timeout);
        if (!query) {
            closeResults();
            return;
        }
        timeout = setTimeout(() => {
            fetch(`/student/universities/search?q=${encodeURIComponent(query)}`)
                .then(response => response.json())
                .then(renderResults)
                .catch(() => {
                    resultsContainer.innerHTML = '<div class="dropdown-list"><div class="dropdown-item">Unable to search</div></div>';
                });
        }, 250);
    });

    document.addEventListener('click', event => {
        if (!resultsContainer.contains(event.target) && event.target !== searchInput) {
            closeResults();
        }
    });
</script>
</body>
</html>
