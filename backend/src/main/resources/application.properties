spring.config.import=optional:dotenv:.env
server.port=8082
spring.application.name=demo

# Default credentials (used by in-memory fallback; database users take precedence)
spring.security.user.name=admin
spring.security.user.password=admin123

# MySQL datasource (use environment variables to override if needed)
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/internshipManagementSystem_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:1234}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.h2.console.enabled=false
