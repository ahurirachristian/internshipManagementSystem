spring.config.import=optional:dotenv:.env
server.port=8082
spring.application.name=demo

spring.security.user.name=admin
spring.security.user.password=admin123

spring.profiles.active=mysql

# MySQL datasource (use environment variables to override if needed)
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/internshipManagementSystem_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:1234}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.h2.console.enabled=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Upload directory. Must be an OS-native path: a Windows value such as
# C:/ims_uploads/ resolves to a relative directory on Linux/macOS.
file.upload-dir=${FILE_UPLOAD_DIR:./uploads}
