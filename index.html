<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Management</title>

    <link rel="stylesheet" href="style.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="container">

    <div class="header">

        <h2>Company Management</h2>

        <button id="addBtn">
            <i class="fa fa-plus"></i>
            Add Company
        </button>

    </div>

    <table id="companyTable">

        <thead>

            <tr>

                <th>Company Name</th>
                <th>Country</th>
                 <th>Branch</th>
                <th> Email</th>
                <th>Website</th>
                <th>Postal Address</th>
                <th>Physical Address</th>
               <th>Action</th>

            </tr>

        </thead>

        <tbody>

        </tbody>

    </table>

</div>


<!-- ================= MODAL ================= -->

<div class="modal" id="companyModal">

<div class="modal-content">

<div class="top">

<h3 id="formTitle">Add Company</h3>

<span id="closeModal">&times;</span>

</div>

<!-- STEP INDICATOR -->

<div class="step-indicator">

<div class="step active">1</div>

<div class="line"></div>

<div class="step">2</div>

<div class="line"></div>

<div class="step">3</div>

</div>


<form id="companyForm">

<!-- STEP 1 -->

<div class="form-step active">

<div class="input-group">

<label>Company Name</label>

<input
type="text"
id="companyName">

</div>

<div class="input-group">

<label>Company Email</label>

<input
type="email"
id="companyEmail">

</div>
<div class="input-group">

<label>Country</label>

<input
type="text"
id="country">

</div>

</div>


<!-- STEP 2 -->

<div class="form-step">

<div class="input-group">

<label>Website</label>

<input
type="text"
id="website"
placeholder="https://example.com">

</div>

</div>


<!-- STEP 3 -->

<div class="form-step">

<div class="input-group">

<label>Postal Address</label>

<input
type="text"
id="postalAddress">

</div>

<div class="input-group">

<label>Physical Address</label>

<input
type="text"
id="physicalAddress">

</div>

</div>


<div class="buttons">

<button
type="button"
id="prevBtn">
Previous
</button>

<button
type="button"
id="nextBtn">
Next
</button>

<button
type="submit"
id="submitBtn">
Finish
</button>

</div>

</form>

</div>

</div>

<script src="s.js"></script>

</body>
</html>
