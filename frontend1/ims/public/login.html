<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internship Management System - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Shared full-screen login/register/reset styles */
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{width:100%;min-height:100vh;margin:0;padding:0;overflow:auto;background:transparent;font-family:'Poppins',sans-serif}
        .split-login{position:relative;min-height:100vh;width:100%;overflow:visible}
        .background{position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#0b5c53 0%,#0e7a6d 25%,#12897a 50%,#1aa08f 75%,#2cc9b5 100%);background-size:400% 400%;animation:gradientShift 12s ease infinite;z-index:1}
        @keyframes gradientShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
        #particleCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:2;cursor:crosshair}
        .login-wrapper{position:relative;z-index:3;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:40px 20px 80px}
        @media(min-width:992px){.login-wrapper{align-items:center}}
        .login-card{background:rgba(255,255,255,0.95);border-radius:24px;box-shadow:0 32px 80px rgba(0,0,0,0.16);width:100%;max-width:480px;padding:42px 38px;margin:40px 0;border:none}
        .login-header{text-align:center;margin-bottom:32px}
        .login-header .logo{width:64px;height:64px;margin:0 auto 16px;background:linear-gradient(135deg,#0b5c53,#07473f);border-radius:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(11,92,83,0.35)}
        .login-header .logo i{font-size:28px;color:#fff}
        .login-header h1{font-size:26px;font-weight:700;color:#1e293b;margin:0 0 8px}
        .login-header p{font-size:14px;color:#64748b;margin:0}
        .alert{display:none;padding:12px 16px;border-radius:10px;margin-bottom:20px;font-size:14px;font-weight:500;text-align:center}
        .alert.show{display:block}
        .alert-success{background:#d1fae5;color:#065f46;border:1px solid #a7f3d0}
        .alert-error{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}
        .form-group{margin-bottom:20px}
        .form-group label{display:block;font-size:14px;font-weight:500;color:#374151;margin-bottom:8px}
        .input-wrapper{position:relative}
        .input-wrapper i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#9ca3af;font-size:16px}
        .form-control{width:100%;padding:12px 44px;border:2px solid #e5e7eb;border-radius:10px;font-size:15px;background:#f9fafb;color:#1f2937}
        .form-control:focus{outline:none;border-color:#0b5c53;background:#fff;box-shadow:0 0 0 4px rgba(11,92,83,0.12)}
        .toggle-password{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;color:#9ca3af;cursor:pointer;padding:4px}
        .btn-login{width:100%;padding:14px;background:linear-gradient(135deg,#0b5c53,#07473f);color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;box-shadow:0 4px 14px rgba(11,92,83,0.4)}
        .btn-login:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(11,92,83,0.5)}
        .login-links{display:flex;justify-content:center;gap:10px;margin-top:20px;color:#475569}
        .login-links a{color:#0b5c53;text-decoration:none;font-weight:600}
        .login-links a:hover{color:#07473f}
        .login-links span{color:#94a3b8}
        @media(max-width:991.98px){.login-wrapper{padding:20px}.login-card{padding:32px}}
    </style>
</head>
<body>
    <div class="split-login">
        <div class="background">
            <canvas id="particleCanvas"></canvas>
        </div>
        <div class="login-wrapper">
            <div class="login-card">
                <div class="login-header">
                    <div class="logo">
                        <i class="fa-solid fa-graduation-cap"></i>
                    </div>
                    <h1>Welcome Back</h1>
                    <p>Sign in to your account</p>
                </div>

                <div id="alertBox" class="alert"></div>

                <form id="loginForm" action="http://localhost:8082/login" method="post">
                    <input type="hidden" name="_csrf" id="csrfToken">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <div class="input-wrapper">
                            <input
                                type="text"
                                id="username"
                                name="username"
                                class="form-control"
                                placeholder="Enter your username"
                                autocomplete="username"
                                required
                            >
                            <i class="fa-solid fa-user"></i>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="role">Role</label>
                        <div class="input-wrapper">
                            <select id="role" name="role" class="form-control" required>
                                <option value="STUDENT">Student</option>
                                <option value="SUPERVISOR">Supervisor</option>
                                <option value="COMPANY">Company</option>
                                <option value="ADMIN">Admin</option>
                            </select>
                            <i class="fa-solid fa-user-tag"></i>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="input-wrapper">
                            <input
                                type="password"
                                id="password"
                                name="password"
                                class="form-control"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required
                            >
                            <i class="fa-solid fa-lock"></i>
                            <button type="button" id="togglePassword" class="toggle-password" aria-label="Show password">
                                <i class="fa-solid fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" id="loginBtn" class="btn-login">
                        Sign In
                    </button>
                </form>

                <div class="login-links">
                    <a href="register.html">Create an account</a>
                    <span>|</span>
                    <a href="forgot-password.html">Forgot password?</a>
                </div>

                <!-- demo accounts removed from UI; see README for demo credentials -->
            </div>
        </div>
    </div>

    <script src="assets/libs/particles.js/particles.js"></script>
    <script src="login.js"></script>
    <script>
        (function () {
            const canvas = document.getElementById('particleCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let width, height;
            let particles = [];
            const particleCount = 110;
            let mouse = { x: null, y: null };
            const radiusLevels = [80, 130, 180, 240, 320];
            let senseRadius = radiusLevels[2];

            function resize() {
                width = canvas.width = canvas.offsetWidth;
                height = canvas.height = canvas.offsetHeight;
            }

            class Particle {
                constructor() {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                    this.vx = (Math.random() - 0.5) * 0.8;
                    this.vy = (Math.random() - 0.5) * 0.8;
                    this.size = Math.random() * 2 + 1;
                }
                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    if (this.x < 0 || this.x > width) this.vx *= -1;
                    if (this.y < 0 || this.y > height) this.vy *= -1;
                }
                draw(hasCursor) {
                    let inWeb = false;
                    let radius = this.size;
                    if (hasCursor && mouse.x !== null) {
                        const dx = mouse.x - this.x;
                        const dy = mouse.y - this.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        inWeb = dist < senseRadius;
                        if (inWeb) radius = this.size + 1.5;
                    }
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, radius, 0, Math.PI * 2);
                    ctx.fillStyle = inWeb ? 'rgba(255, 255, 255, 1)' : 'rgba(255, 255, 255, 0.85)';
                    ctx.fill();
                }
            }

            function init() {
                resize();
                particles = [];
                for (let i = 0; i < particleCount; i++) {
                    particles.push(new Particle());
                }
            }

            function animate() {
                ctx.clearRect(0, 0, width, height);
                const hasCursor = mouse.x !== null;

                for (let i = 0; i < particles.length; i++) {
                    particles[i].update();
                    particles[i].draw(hasCursor);
                }

                if (hasCursor) {
                    const linkDistance = 120;
                    const pToCursor = new Array(particles.length);

                    for (let i = 0; i < particles.length; i++) {
                        const dx = mouse.x - particles[i].x;
                        const dy = mouse.y - particles[i].y;
                        pToCursor[i] = Math.sqrt(dx * dx + dy * dy);
                    }

                    for (let i = 0; i < particles.length; i++) {
                        const d1 = pToCursor[i];
                        if (d1 >= senseRadius) continue;

                        const opacity = (1 - d1 / senseRadius) * 0.6;
                        ctx.beginPath();
                        ctx.moveTo(mouse.x, mouse.y);
                        ctx.lineTo(particles[i].x, particles[i].y);
                        ctx.strokeStyle = 'rgba(255, 255, 255, ' + opacity + ')';
                        ctx.lineWidth = 0.8;
                        ctx.stroke();

                        for (let j = i + 1; j < particles.length; j++) {
                            const d2 = pToCursor[j];
                            if (d2 >= senseRadius) continue;
                            const pdx = particles[i].x - particles[j].x;
                            const pdy = particles[i].y - particles[j].y;
                            const pd = Math.sqrt(pdx * pdx + pdy * pdy);
                            if (pd < linkDistance) {
                                const avg = (d1 + d2) / 2;
                                const meshOpacity = (1 - avg / senseRadius) * 0.4;
                                ctx.beginPath();
                                ctx.moveTo(particles[i].x, particles[i].y);
                                ctx.lineTo(particles[j].x, particles[j].y);
                                ctx.strokeStyle = 'rgba(255, 255, 255, ' + meshOpacity + ')';
                                ctx.lineWidth = 0.6;
                                ctx.stroke();
                            }
                        }
                    }
                }

                requestAnimationFrame(animate);
            }

            window.addEventListener('mousemove', function (e) {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
            });

            window.addEventListener('mouseout', function (e) {
                if (!e.relatedTarget) {
                    mouse.x = null;
                    mouse.y = null;
                }
            });

            window.addEventListener('resize', function () {
                resize();
                particles.forEach(p => {
                    if (p.x > width) p.x = width;
                    if (p.y > height) p.y = height;
                });
            });

            init();
            animate();
        })();
    </script>
</body>
</html>
