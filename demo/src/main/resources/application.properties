spring.application.name=demo

# Default: embedded H2 for local testing
spring.datasource.url=jdbc:h2:mem:demo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Replace the above with your provided database settings when available
# spring.datasource.url=jdbc:postgresql://host:5432/dbname
# spring.datasource.username=your_user
# spring.datasource.password=your_password
# spring.datasource.driverClassName=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
